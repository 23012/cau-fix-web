name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/ubuntu/cau-fix-web

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 20 설정
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 프론트엔드 의존성 설치 및 빌드
        run: cd frontend && npm install && CI=false npm run build

      - name: 백엔드 의존성 설치
        run: cd backend && npm install

  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash
    steps:
      - name: 시크릿 검증
        run: |
          missing=""
          if [ -z "${{ secrets.DB_NAME }}" ]; then missing="$missing DB_NAME"; fi
          if [ -z "${{ secrets.DB_USER }}" ]; then missing="$missing DB_USER"; fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then missing="$missing DB_PASSWORD"; fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then missing="$missing JWT_SECRET"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
          echo "All required secrets are configured."

      - name: 코드 업데이트
        run: |
          cd $DEPLOY_PATH
          git pull origin main

      - name: 환경변수 파일 생성
        run: |
          cat > $DEPLOY_PATH/.env << EOF
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
          echo ".env file created successfully."

      - name: 백엔드 의존성 설치
        run: |
          cd $DEPLOY_PATH/backend
          npm install
          echo "Backend dependencies installed successfully."

      - name: 프론트엔드 의존성 설치 및 빌드
        run: |
          cd $DEPLOY_PATH/frontend
          npm install
          CI=false npm run build
          echo "Frontend build completed successfully."

      - name: PM2 백엔드 재시작
        run: |
          cd $DEPLOY_PATH
          if pm2 describe cau-fix-backend > /dev/null 2>&1; then
            echo "PM2 process 'cau-fix-backend' found. Reloading..."
            pm2 reload cau-fix-backend
          else
            echo "PM2 process 'cau-fix-backend' not found. Starting..."
            pm2 start ecosystem.config.js
          fi
          pm2 save
          echo "Backend service updated successfully."

      - name: nginx 설정 배포 및 reload
        run: |
          cd $DEPLOY_PATH
          # 기존 설정 백업
          sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak

          # 새 설정 파일 복사
          sudo cp nginx/nginx.prod.conf /etc/nginx/nginx.conf

          # 설정 파일 문법 검증
          if sudo nginx -t; then
            echo "nginx config validation passed."
            sudo systemctl reload nginx
            echo "nginx reloaded successfully."
          else
            echo "nginx config validation FAILED. Restoring backup..."
            sudo cp /etc/nginx/nginx.conf.bak /etc/nginx/nginx.conf
            exit 1
          fi

name: Deploy to Production

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/facility-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/facility-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest

      - name: Frontend 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    runs-on: self-hosted  # 로컬 서버 runner
    needs: build
    steps:
      - name: .env 생성
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" > C:\Users\Administrator\Documents\cau-fix\cau-fix-web\.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> C:\Users\Administrator\Documents\cau-fix\cau-fix-web\.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> C:\Users\Administrator\Documents\cau-fix\cau-fix-web\.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> C:\Users\Administrator\Documents\cau-fix\cau-fix-web\.env

      - name: 배포
        run: |
          cd C:\Users\Administrator\Documents\cau-fix\cau-fix-web
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
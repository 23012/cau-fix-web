name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/cau-fix-web

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 20 설정
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 프론트엔드 의존성 설치 및 빌드
        run: cd frontend && npm install && CI=false npm run build

      - name: 백엔드 의존성 설치
        run: cd backend && npm install

  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash
    steps:
      - name: 시크릿 검증
        run: |
          missing=""
          if [ -z "${{ secrets.DB_NAME }}" ]; then missing="$missing DB_NAME"; fi
          if [ -z "${{ secrets.DB_USER }}" ]; then missing="$missing DB_USER"; fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then missing="$missing DB_PASSWORD"; fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then missing="$missing JWT_SECRET"; fi
          if [ -z "${{ secrets.VAPID_PUBLIC_KEY }}" ]; then missing="$missing VAPID_PUBLIC_KEY"; fi
          if [ -z "${{ secrets.VAPID_PRIVATE_KEY }}" ]; then missing="$missing VAPID_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
          echo "All required secrets are configured."

      - name: 코드 업데이트
        run: |
          cd $DEPLOY_PATH
          git pull origin main

      - name: 환경변수 파일 생성
        run: |
          DB_HOST="${{ secrets.DB_HOST }}"; [ -z "$DB_HOST" ] && DB_HOST="localhost"
          DB_PORT="${{ secrets.DB_PORT }}"; [ -z "$DB_PORT" ] && DB_PORT="5432"
          ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}"
          cat > $DEPLOY_PATH/.env << EOF
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PORT=$DB_PORT
          DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@$DB_HOST:$DB_PORT/${{ secrets.DB_NAME }}
          NODE_ENV=production
          PORT=3000
          TZ=Asia/Seoul
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          VAPID_SUBJECT=mailto:admin@caufix.com
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          EOF
          echo ".env file created successfully."

      - name: 백엔드 의존성 설치
        run: |
          cd $DEPLOY_PATH/backend
          npm install
          echo "Backend dependencies installed successfully."

      - name: 프론트엔드 의존성 설치 및 빌드
        run: |
          cd $DEPLOY_PATH/frontend
          npm install
          CI=false npm run build
          echo "Frontend build completed successfully."

      - name: PM2 백엔드 재시작
        run: |
          cd $DEPLOY_PATH
          if pm2 describe cau-fix-backend > /dev/null 2>&1; then
            echo "PM2 process 'cau-fix-backend' found. Reloading..."
            pm2 reload cau-fix-backend
          else
            echo "PM2 process 'cau-fix-backend' not found. Starting..."
            pm2 start ecosystem.config.js
          fi
          pm2 save
          echo "Backend service updated successfully."

      # [제거됨] nginx 설정 자동배포 단계.
      # 리포의 nginx/nginx.prod.conf는 자체서명 인증서를 사용하고 nginx.conf를 통째로
      # 덮어써서 실제 운영 설정(/etc/nginx/sites-available/cau-fix)과 정식 인증서를
      # 무력화 → ERR_CERT_AUTHORITY_INVALID 장애를 유발한다.
      # nginx는 서버에서 수동 관리하므로 배포 파이프라인에서 절대 건드리지 않는다.
